# Template workflow to run the tests that do not require API keys and upload
# their coverage to Codecov (flag: unittests). The API-key dependent acceptance
# tests live in _test_acceptance.yaml.
#

name: Test

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      python-version:
        type: string
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  Test:
    name: Test ${{ inputs.os }} ${{ inputs.python-version }}
    runs-on: ${{ inputs.os }}
    env:
      OS: ${{ inputs.os }}
      PYTHON: ${{ inputs.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.3.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Download the built wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install package (Linux or macOS)
        if: runner.os != 'Windows'
        run: |
          uv venv
          source .venv/bin/activate
          echo ${GITHUB_WORKSPACE}/.venv/bin >> $GITHUB_PATH
          uv pip install "$(find dist -name '*.whl' | head -1)" -r requirements-dev.txt

      - name: Install package (Windows)
        if: runner.os == 'Windows'
        run: |
          uv venv
          .venv\Scripts\activate.ps1
          echo "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wheel = (Get-ChildItem -Path dist -Filter "*.whl" | Select-Object -First 1).FullName
          uv pip install "$wheel" -r requirements-dev.txt

      - name: Run the tests
        run: >
          pytest -vv -x -n auto -m "not acceptance" --cov=infinity_grid
          --cov-report=xml:coverage.xml --junitxml=junit-unittests.xml
          -o junit_family=legacy tests

      - name: Export coverage report
        if: ${{ inputs.os == 'ubuntu-latest' && inputs.python-version == '3.11' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unittests
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: |
          inputs.os == 'ubuntu-latest'
          && inputs.python-version == '3.11'
          && github.actor == 'btschwertfeger'
          && github.event_name != 'schedule'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          flags: unittests
          report_type: coverage
          name: codecov-umbrella
          verbose: true

      - name: Upload test results to Codecov
        if: |
          inputs.os == 'ubuntu-latest'
          && inputs.python-version == '3.11'
          && github.actor == 'btschwertfeger'
          && github.event_name != 'schedule'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-unittests.xml
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          flags: unittests
          report_type: test_results
          name: codecov-umbrella
          verbose: true
