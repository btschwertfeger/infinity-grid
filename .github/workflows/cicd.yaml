# Workflow running for master and release events

name: CI/CD

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * FRI"
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict the default token to read-only; jobs opt into more as needed.
permissions:
  contents: read

jobs:
  ## ===========================================================================
  ##    Checks the code logic, style and more
  ##
  Pre-Commit:
    uses: ./.github/workflows/_pre_commit.yaml

  ## ===========================================================================
  ##  Discover vulnerabilities
  ##
  CodeQL:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/_codeql.yaml

  ## ===========================================================================
  ##    Builds the package on multiple OS for multiple
  ##    Python versions
  ##
  Build:
    needs: [Pre-Commit]
    uses: ./.github/workflows/_build.yaml
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}

  ## ===========================================================================
  ##    Build the documentation
  ##
  Build-Doc:
    needs: [Pre-Commit]
    uses: ./.github/workflows/_build_doc.yaml
    with:
      os: "ubuntu-latest"
      python-version: "3.11"

  ## ===========================================================================
  ##    Run the unit and integration tests
  ##
  Test:
    needs: [Build]
    uses: ./.github/workflows/_test.yaml
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ## ===========================================================================
  ##    Run the acceptance tests (require live read-only API keys) and upload
  ##    their coverage to codecov
  ##
  Test-Acceptance:
    if: |
      success()
      && github.actor == 'btschwertfeger'
      && github.event_name != 'schedule'
    needs: [Build]
    uses: ./.github/workflows/_test_acceptance.yaml
    strategy:
      fail-fast: true
      # Serialized (one at a time) because the jobs share a single Kraken API
      # key; concurrent requests would trigger nonce errors.
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      INFINITY_GRID_API_PUBLIC_KEY: ${{ secrets.INFINITY_GRID_API_PUBLIC_KEY }}
      INFINITY_GRID_API_SECRET_KEY: ${{ secrets.INFINITY_GRID_API_SECRET_KEY }}

  ## ===========================================================================
  ##    Build and push the container image
  ##
  ContainerImage:
    needs:
      - Build
      - Build-Doc
      - CodeQL
      - Test
      - Test-Acceptance
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build_image_release.yaml
    if: |
      success()
      && github.actor == 'btschwertfeger'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/master')
        || github.event_name == 'release'
      )
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  ## ===========================================================================
  ##    Uploads the package to test.pypi.org on master if triggered by
  ##    a regular commit/push.
  ##
  UploadTestPyPI:
    if: |
      success()
      && github.ref == 'refs/heads/master'
      && github.event_name == 'push'
    needs:
      - Build
      - Build-Doc
      - ContainerImage
      - CodeQL
      - Test
      - Test-Acceptance
    name: Upload development version to Test PyPI
    # Trusted Publishing does not support reusable workflows, so the publish
    # step runs inline here rather than in a called workflow. See
    # https://github.com/pypi/warehouse/issues/11096
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mandatory for OIDC Trusted Publishing
    environment:
      name: testpypi
      url: https://test.pypi.org/p/infinity-grid
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev
            ghcr.io
            github.com:443
            pkg-containers.githubusercontent.com:443
            rekor.sigstore.dev
            test.pypi.org
            tuf-repo-cdn.sigstore.dev
            uploads.github.com:443

      - name: Download all the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to Test PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  ## ===========================================================================
  ##    Upload the package to PyPI
  ##
  UploadPyPI:
    if: |
      success()
      && github.actor == 'btschwertfeger'
      && github.event_name == 'release'
    needs:
      - Build
      - Build-Doc
      - ContainerImage
      - CodeQL
      - Test
      - Test-Acceptance
    name: Upload release to PyPI
    # Trusted Publishing does not support reusable workflows, so the publish
    # step runs inline here rather than in a called workflow. See
    # https://github.com/pypi/warehouse/issues/11096
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mandatory for OIDC Trusted Publishing
    environment:
      name: pypi
      url: https://pypi.org/p/infinity-grid
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev
            ghcr.io
            github.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org
            rekor.sigstore.dev
            tuf-repo-cdn.sigstore.dev
            upload.pypi.org
            uploads.github.com:443

      - name: Download all the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
