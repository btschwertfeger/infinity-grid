# Template workflow to run the acceptance tests, which require live (read-only)
# exchange API keys, and upload their coverage to Codecov (flag: acceptance).
# Kept separate from _test.yaml so the API keys are only exposed to this single
# job instead of every matrix cell.
#

name: Test Acceptance

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      python-version:
        type: string
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false
      INFINITY_GRID_API_PUBLIC_KEY:
        required: false
      INFINITY_GRID_API_SECRET_KEY:
        required: false

permissions:
  contents: read

jobs:
  Test-Acceptance:
    name: Acceptance ${{ inputs.os }} ${{ inputs.python-version }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 10
    env:
      OS: ${{ inputs.os }}
      PYTHON: ${{ inputs.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.3.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Download the built wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install package
        run: |
          uv venv
          source .venv/bin/activate
          echo ${GITHUB_WORKSPACE}/.venv/bin >> $GITHUB_PATH
          uv pip install "$(find dist -name '*.whl' | head -1)" -r requirements-dev.txt

      - name: Run the acceptance tests
        env:
          INFINITY_GRID_API_PUBLIC_KEY: ${{ secrets.INFINITY_GRID_API_PUBLIC_KEY }}
          INFINITY_GRID_API_SECRET_KEY: ${{ secrets.INFINITY_GRID_API_SECRET_KEY }}
        run: >
          pytest -vv -x -n auto -m acceptance --cov=infinity_grid
          --cov-report=xml:coverage.xml --junitxml=junit-acceptance.xml
          -o junit_family=legacy tests

      - name: Export coverage report
        if: ${{ inputs.os == 'ubuntu-latest' && inputs.python-version == '3.11' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-acceptance
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ inputs.os == 'ubuntu-latest' && inputs.python-version == '3.11' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          flags: acceptance
          report_type: coverage
          name: codecov-umbrella
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ inputs.os == 'ubuntu-latest' && inputs.python-version == '3.11' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-acceptance.xml
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          flags: acceptance
          report_type: test_results
          name: codecov-umbrella
          verbose: true
