# Workflow running for pull requests

name: PR CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ## ===========================================================================
  ##    Checks the code logic, style and more
  ##
  Pre-Commit:
    uses: ./.github/workflows/_pre_commit.yaml

  ## ===========================================================================
  ##  Discover vulnerabilities
  ##
  CodeQL:
    uses: ./.github/workflows/_codeql.yaml

  # ===========================================================================
  #    Builds the package on multiple OS for multiple
  #    Python versions
  #
  Build:
    needs: [Pre-Commit]
    uses: ./.github/workflows/_build.yaml
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest] # Windows is not supported
        python-version: ["3.11", "3.12", "3.13", "3.14"] # just for compatibility reasons
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}

  ## ===========================================================================
  ##    Build the documentation
  ##
  Build-Doc:
    needs: [Pre-Commit]
    uses: ./.github/workflows/_build_doc.yaml
    with:
      os: "ubuntu-latest"
      python-version: "3.11"

  ## ===========================================================================
  ##    Run the unit and integration tests
  ##
  Test:
    needs: [Build]
    uses: ./.github/workflows/_test.yaml
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ## ===========================================================================
  ##    Run the acceptance tests (require live read-only API keys) and upload
  ##    their coverage to codecov
  ##
  Test-Acceptance:
    if: success() && github.actor == 'btschwertfeger'
    needs: [Build]
    uses: ./.github/workflows/_test_acceptance.yaml
    strategy:
      fail-fast: true
      # Serialized (one at a time) because the jobs share a single Kraken API
      # key; concurrent requests would trigger nonce errors.
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      INFINITY_GRID_API_PUBLIC_KEY: ${{ secrets.INFINITY_GRID_API_PUBLIC_KEY }}
      INFINITY_GRID_API_SECRET_KEY: ${{ secrets.INFINITY_GRID_API_SECRET_KEY }}

  ## ===========================================================================
  ##    Build and push the Docker image
  ##
  ContainerImage:
    needs:
      - Pre-Commit
      - Build
      - Build-Doc
      - Test
      - CodeQL
    uses: ./.github/workflows/_build_image_pull_request.yaml
